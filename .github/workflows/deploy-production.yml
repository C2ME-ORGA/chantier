name: deploy-production

on:
  release:
    types:
      - published

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-promotion:
    name: validate-promotion
    if: ${{ github.event.release.prerelease == false && github.event.release.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_BODY: ${{ github.event.release.body }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}

    outputs:
      candidate_tag: ${{ steps.promotion.outputs.candidate_tag }}
      release_commit: ${{ steps.promotion.outputs.release_commit }}
      release_tree: ${{ steps.promotion.outputs.release_tree }}
      candidate_commit: ${{ steps.promotion.outputs.candidate_commit }}
      candidate_tree: ${{ steps.promotion.outputs.candidate_tree }}
      staging_run_id: ${{ steps.promotion.outputs.staging_run_id }}
      package_artifact_id: ${{ steps.promotion.outputs.package_artifact_id }}
      package_name: ${{ steps.promotion.outputs.package_name }}
      manifest_artifact_id: ${{ steps.promotion.outputs.manifest_artifact_id }}
      sha256: ${{ steps.promotion.outputs.sha256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate published release
        id: release
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          printf '%s\n' "$RELEASE_BODY" > "$RUNNER_TEMP/release/body.md"

          bash .github/scripts/deploy/validate-release.sh \
            --tag "$RELEASE_TAG" \
            --draft "$RELEASE_IS_DRAFT" \
            --prerelease "$RELEASE_IS_PRERELEASE" \
            --body-file "$RUNNER_TEMP/release/body.md"

      - name: Validate stable tag
        id: tag
        run: |
          bash .github/scripts/deploy/validate-tag.sh \
            --channel production \
            --tag "$RELEASE_TAG" \
            --ref origin/main

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Resolve and verify staging promotion
        id: promotion
        env:
          CANDIDATE_TAG: ${{ steps.release.outputs.candidate_tag }}
          WORK_DIR: ${{ runner.temp }}/promotion
        run: |
          bash .github/scripts/deploy/resolve-promotion.sh

  deploy:
    name: deploy-production
    needs: validate-promotion
    if: ${{ github.event.release.prerelease == false && github.event.release.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      APP_URL: ${{ vars.APP_URL }}
      DEPLOY_PHP_BIN: ${{ vars.DEPLOY_PHP_BIN }}
      DEPLOY_ROUTE_CACHE: ${{ vars.DEPLOY_ROUTE_CACHE }}
      DEPLOY_QUEUE_RESTART: ${{ vars.DEPLOY_QUEUE_RESTART }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}
      CANDIDATE_TAG: ${{ needs.validate-promotion.outputs.candidate_tag }}
      RELEASE_COMMIT: ${{ needs.validate-promotion.outputs.release_commit }}
      RELEASE_TREE: ${{ needs.validate-promotion.outputs.release_tree }}
      STAGING_RUN_ID: ${{ needs.validate-promotion.outputs.staging_run_id }}
      PACKAGE_NAME: ${{ needs.validate-promotion.outputs.package_name }}
      PACKAGE_ARTIFACT_ID: ${{ needs.validate-promotion.outputs.package_artifact_id }}
      MANIFEST_ARTIFACT_ID: ${{ needs.validate-promotion.outputs.manifest_artifact_id }}
      PACKAGE_SHA256: ${{ needs.validate-promotion.outputs.sha256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate environment configuration
        run: |
          expected_environment='production'
          expected_path='/www/wwwroot/chantier'
          expected_url='https://chantier.c2me.fr'

          if [[ "$DEPLOY_ENVIRONMENT" != "$expected_environment" ]]; then
            echo "DEPLOY_ENVIRONMENT incohérent pour ce workflow." >&2
            exit 1
          fi

          if [[ "$DEPLOY_PATH" != "$expected_path" ]]; then
            echo "DEPLOY_PATH incohérent pour ce workflow." >&2
            exit 1
          fi

          if [[ "$APP_URL" != "$expected_url" ]]; then
            echo "APP_URL incohérent pour ce workflow." >&2
            exit 1
          fi

          if [[ "$DEPLOY_ROUTE_CACHE" != 'true' && "$DEPLOY_ROUTE_CACHE" != 'false' ]]; then
            echo "DEPLOY_ROUTE_CACHE doit valoir true ou false." >&2
            exit 1
          fi

          if [[ "$DEPLOY_QUEUE_RESTART" != 'true' && "$DEPLOY_QUEUE_RESTART" != 'false' ]]; then
            echo "DEPLOY_QUEUE_RESTART doit valoir true ou false." >&2
            exit 1
          fi

      - name: Revalidate stable tag
        id: tag
        run: |
          bash .github/scripts/deploy/validate-tag.sh \
            --channel production \
            --tag "$RELEASE_TAG" \
            --ref origin/main > "$RUNNER_TEMP/tag-output.txt"

          tag_commit="$(grep '^commit_sha=' "$RUNNER_TEMP/tag-output.txt" | cut -d= -f2)"
          tag_tree="$(grep '^tree_sha=' "$RUNNER_TEMP/tag-output.txt" | cut -d= -f2)"

          if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Commit recalculé incohérent avec la validation de promotion." >&2
            exit 1
          fi

          if [[ "$tag_tree" != "$RELEASE_TREE" ]]; then
            echo "Arbre Git recalculé incohérent avec la validation de promotion." >&2
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Download verified staging artifact
        id: download
        run: |
          artifact_dir="$RUNNER_TEMP/artifact"
          gh run download "$STAGING_RUN_ID" --repo "$GITHUB_REPOSITORY_NAME" --name "$PACKAGE_NAME" --dir "$artifact_dir"

          page=1
          found=""

          while (( page <= 20 )); do
            gh api "repos/${GITHUB_REPOSITORY_NAME}/actions/runs/${STAGING_RUN_ID}/artifacts?per_page=100&page=${page}" \
              > "$RUNNER_TEMP/artifacts-${page}.json"

            lines="$(php .github/scripts/lib/github-data.php artifacts "$RUNNER_TEMP/artifacts-${page}.json" "$PACKAGE_NAME")"

            if [[ -n "$lines" ]]; then
              found="$lines"
              break
            fi

            count="$(php .github/scripts/lib/github-data.php count "$RUNNER_TEMP/artifacts-${page}.json" artifacts)"

            if (( count < 100 )); then
              break
            fi

            page=$((page + 1))
          done

          if [[ -z "$found" ]]; then
            echo "Artefact de paquet introuvable pour le run $STAGING_RUN_ID." >&2
            exit 1
          fi

          count="$(printf '%s' "$found" | grep -c . || true)"

          if [[ "$count" -ne 1 ]]; then
            echo "Ambiguïté sur l'artefact $PACKAGE_NAME : $count entrées trouvées." >&2
            exit 1
          fi

          IFS=$'\t' read -r artifact_id artifact_expired artifact_label _artifact_size <<< "$found"

          if [[ "$artifact_expired" != "false" ]]; then
            echo "Artefact expiré : $PACKAGE_NAME" >&2
            exit 1
          fi

          if [[ "$artifact_id" != "$PACKAGE_ARTIFACT_ID" ]]; then
            echo "Identifiant d'artefact incohérent : $artifact_id au lieu de $PACKAGE_ARTIFACT_ID." >&2
            exit 1
          fi

          package_path="$artifact_dir/chantier-${CANDIDATE_TAG}.tar.gz"

          if [[ ! -f "$package_path" ]]; then
            echo "Paquet téléchargé introuvable : $package_path" >&2
            exit 1
          fi

          computed_sha="$(sha256sum "$package_path" | awk '{print $1}')"

          if [[ "$computed_sha" != "$PACKAGE_SHA256" ]]; then
            echo "Empreinte SHA-256 incohérente pour le paquet téléchargé." >&2
            exit 1
          fi

          echo "package_path=$package_path" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Secret manquant pour l'environnement production : $name" >&2
              exit 1
            fi
          done

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          if ! ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1 \
            && ! ssh-keygen -F "[$SSH_HOST]:$SSH_PORT" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
            echo "SSH_KNOWN_HOSTS ne contient pas l'hôte attendu." >&2
            exit 1
          fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Transfer package
        id: transfer
        run: |
          remote_package="/tmp/chantier-${RELEASE_TAG}-${GITHUB_RUN_ID}.tar.gz"

          scp -P "$SSH_PORT" -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            "${{ steps.download.outputs.package_path }}" \
            "$SSH_USER@$SSH_HOST:$remote_package"

          echo "remote_package=$remote_package" >> "$GITHUB_OUTPUT"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}

      - name: Deploy release
        id: deploy
        run: |
          release_id="${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ssh -p "$SSH_PORT" -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PHP_BIN='$DEPLOY_PHP_BIN' bash -s -- \
              --environment '$DEPLOY_ENVIRONMENT' \
              --release-id '$release_id' \
              --version '$RELEASE_TAG' \
              --commit '$RELEASE_COMMIT' \
              --tree '$RELEASE_TREE' \
              --artifact-id '$PACKAGE_ARTIFACT_ID' \
              --sha256 '$PACKAGE_SHA256' \
              --package '${REMOTE_PACKAGE}' \
              --expected-path '$DEPLOY_PATH' \
              --route-cache '$DEPLOY_ROUTE_CACHE' \
              --queue-restart '$DEPLOY_QUEUE_RESTART'" \
            < .github/scripts/deploy/remote-deploy.sh

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PACKAGE: ${{ steps.transfer.outputs.remote_package }}

      - name: Check deployment
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- \
              --environment '$DEPLOY_ENVIRONMENT' \
              --release-id '${{ steps.deploy.outputs.release_id }}' \
              --version '$RELEASE_TAG' \
              --commit '$RELEASE_COMMIT' \
              --sha256 '$PACKAGE_SHA256' \
              --expected-path '$DEPLOY_PATH'" \
            < .github/scripts/deploy/remote-check.sh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}

      - name: Check HTTP health endpoint
        run: |
          body="$RUNNER_TEMP/health.json"
          code=""
          status=""

          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 15 \
              -H 'Accept: application/json' "${APP_URL}/up" || true)"

            status=""
            if [[ -s "$body" ]]; then
              status="$(php .github/scripts/lib/manifest.php get "$body" status 2>/dev/null || true)"
            fi

            if [[ "$code" == "200" && "$status" == "up" ]]; then
              echo "Point de santé disponible : HTTP 200, statut up." >&2
              exit 0
            fi

            sleep 5
          done

          echo "Point de santé indisponible : code HTTP '$code', statut '$status'." >&2
          exit 1

      - name: Write deployment manifest
        id: manifest
        run: |
          mkdir -p "$RUNNER_TEMP/manifest"

          php .github/scripts/lib/manifest.php create "$RUNNER_TEMP/manifest/manifest.json" \
            schema_version=1 \
            environment=production \
            version="$RELEASE_TAG" \
            tag="$RELEASE_TAG" \
            channel=stable \
            commit_sha="$RELEASE_COMMIT" \
            tree_sha="$RELEASE_TREE" \
            "workflow.name=deploy-production" \
            "workflow.run_id=$GITHUB_RUN_ID" \
            "workflow.run_attempt=$GITHUB_RUN_ATTEMPT" \
            "artifact.name=$PACKAGE_NAME" \
            "artifact.id=$PACKAGE_ARTIFACT_ID" \
            "artifact.sha256=$PACKAGE_SHA256" \
            "staging.candidate_tag=$CANDIDATE_TAG" \
            "staging.run_id=$STAGING_RUN_ID" \
            "staging.manifest_artifact_id=$MANIFEST_ARTIFACT_ID" \
            staging_deployment.status=success \
            "staging_deployment.run_id=$STAGING_RUN_ID" \
            created_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          php .github/scripts/lib/manifest.php validate "$RUNNER_TEMP/manifest/manifest.json"

          echo "manifest_path=$RUNNER_TEMP/manifest/manifest.json" >> "$GITHUB_OUTPUT"

      - name: Upload deployment manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chantier-manifest-${{ github.event.release.tag_name }}-production
          path: ${{ runner.temp }}/manifest/manifest.json
          retention-days: 90
          if-no-files-found: error

      - name: Clean up remote package
        if: always()
        continue-on-error: true
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "rm -f '${{ steps.transfer.outputs.remote_package }}'"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}

      - name: Summary
        run: |
          {
            echo "## Déploiement production"
            echo ""
            echo "- Version : \`$RELEASE_TAG\`"
            echo "- Candidate staging : \`$CANDIDATE_TAG\`"
            echo "- Commit : \`$RELEASE_COMMIT\`"
            echo "- Arbre Git : \`$RELEASE_TREE\`"
            echo "- Artefact réutilisé : \`$PACKAGE_NAME\` (#$PACKAGE_ARTIFACT_ID)"
            echo "- Exécution de staging : #$STAGING_RUN_ID"
            echo "- Release : \`${{ steps.deploy.outputs.release_id }}\`"
            echo "- Point de santé : \`${APP_URL}/up\`"
          } >> "$GITHUB_STEP_SUMMARY"
