
name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run release automation tests
        run: bash .github/scripts/tests/test-release-automation.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Validate workflows and MariaDB configuration
        run: php .github/scripts/tests/validate-workflows.php

      - name: Run deployment automation tests
        run: bash .github/scripts/tests/test-deployment-automation.sh

      - name: Run backup and restore script tests
        run: bash scripts/ops/tests/test-backup-restore.sh

      - name: Run application rollback tests
        run: bash scripts/ops/tests/test-rollback.sh

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run CI checks
        run: composer ci:check

  mariadb:
    name: mariadb-10.11
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Base éphémère réservée à la CI : aucun accès au serveur C2ME et aucun
    # identifiant d'un environnement réel. Les valeurs sont jetables et ne
    # doivent jamais être réutilisées hors de ce service.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: chantier_test
          MARIADB_USER: chantier_test
          MARIADB_PASSWORD: ci-chantier-test-only
          MARIADB_ROOT_PASSWORD: ci-chantier-root-only
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: chantier_test
      DB_USERNAME: chantier_test
      DB_PASSWORD: ci-chantier-test-only

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Verify Laravel MariaDB connection
        run: php scripts/ci/verify-mariadb.php

      - name: Run MariaDB migrations
        run: php artisan migrate:fresh --force --no-interaction

      - name: Verify MariaDB migration status
        run: |
          php artisan migrate:status --no-ansi
          php scripts/ci/verify-mariadb-migrations.php

      - name: Run MariaDB test suite
        run: vendor/bin/pest --configuration=phpunit.mariadb.xml --colors=never

  package-linux:
    name: package-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build and verify Linux package
        run: bash .github/scripts/tests/test-assemble-linux.sh
