name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/deploy/validate-release-tag.sh \
            --tag "$RELEASE_TAG"

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/generate-release-notes.sh \
            "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-notes.md"

      - name: Reference staging candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/deploy/stable-candidate.sh \
            --tag "$RELEASE_TAG" \
            --notes "$RUNNER_TEMP/release-notes.md"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            release_flags=(--prerelease)
          else
            release_flags=(--draft)
          fi

          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [[ "$RELEASE_TAG" == *-rc.* ]]; then
              gh release edit "$RELEASE_TAG" \
                --repo "$REPO" \
                --title "$RELEASE_TAG" \
                --notes-file "$NOTES_FILE" \
                --prerelease
            else
              gh release edit "$RELEASE_TAG" \
                --repo "$REPO" \
                --title "$RELEASE_TAG" \
                --notes-file "$NOTES_FILE"
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$REPO" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$NOTES_FILE" \
              "${release_flags[@]}"
          fi
